[project]
name = "tovano"
version = "1.0.0"
description = "Official Python client for the Tovano API: one API key, one balance and one invoice for image, video, audio and text models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tovano", email = "support@tovano.ai" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1"]
keywords = ["tovano", "ai", "api", "sdk", "image generation", "video generation", "text to speech", "llm", "openai compatible"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://tovano.ai"
Documentation = "https://tovano.ai/docs/sdk"
Repository = "https://github.com/tovanoai/tovano-python"
Issues = "https://github.com/tovanoai/tovano-python/issues"
Changelog = "https://github.com/tovanoai/tovano-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tovano"]

[tool.hatch.build.targets.sdist]
include = ["src/tovano", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 60

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
per-file-ignores = { "examples/*" = ["E501"] }
ignore = ["UP006", "UP007", "UP035", "UP045", "B904", "UP037"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tovano"]
